# Bounded full-task variants. Distances m, angles rad, planning budgets s.
# These are candidate sources; infeasible profiles remain archived as failures.
plan_pick_place:
  ros__parameters:
    candidate_profiles: [front, left, right, short_front, yaw_front, high_route, diagonal_place, rrt_repeat]
    planning_candidates: 2
    candidate_min_clearance_m: 0.001
    candidate_collision_step_rad: 0.01
    candidate_start_tolerance_rad: 0.01
    profiles:
      front: {grasp_yaw_rad: 0.0, planning_timeout_sec: 12.0}
      left: {grasp_yaw_rad: 1.5707963267948966, planning_timeout_sec: 12.0}
      right: {grasp_yaw_rad: -1.5707963267948966, planning_timeout_sec: 12.0}
      short_front: {approach_distance_m: 0.08, planning_timeout_sec: 12.0}
      yaw_front: {spin_offset_rad: 0.12, planning_timeout_sec: 12.0}
      # Tool pose in motion_frame after lift, before the place connector.
      high_route:
        transport_waypoint: [0.30, 0.0, 0.72, 0.5, 0.5, 0.5, 0.5]
        planning_timeout_sec: 15.0
      diagonal_place:
        place_direction: [0.24253562503633297, 0.0, -0.9701425001453319]
        retreat_direction: [-0.9701425001453319, 0.0, 0.24253562503633297]
        planning_timeout_sec: 12.0
      rrt_repeat:
        planner_id: RRTkConfigDefault
        repetitions: 2
        planning_timeout_sec: 12.0
